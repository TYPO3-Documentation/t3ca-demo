<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<f:comment>
    The search box plugin, which on this site renders the filter beside the results:
    the search field is the one in the page header. The search word travels along as
    a hidden field, so applying the filter keeps it. A change of filter starts over on
    the first page of results.
</f:comment>
<f:layout name="General" />

<f:section name="content">
    <f:if condition="{filters}">
        <form class="filters" method="get" action="{targetPageUrl}" aria-label="{f:translate(key: 'search.filters', domain: 'mtosafi_sitepackage.frontend')}">
            <input type="hidden" name="{conf.searchWordParameter}" value="{searchword -> f:format.raw()}" />
            <f:if condition="{lparam}">
                <input type="hidden" name="L" value="{lparam}" />
            </f:if>
            <f:if condition="{sortByField}">
                <input type="hidden" name="tx_kesearch_pi1[sortByField]" value="{sortByField}" />
            </f:if>
            <f:if condition="{sortByDir}">
                <input type="hidden" name="tx_kesearch_pi1[sortByDir]" value="{sortByDir}" />
            </f:if>
            <f:render partial="Filters" arguments="{conf: conf, filters: filters}" />
            <button class="button" type="submit"><f:translate key="search.filters.apply" domain="mtosafi_sitepackage.frontend" /></button>
        </form>
    </f:if>
</f:section>
</html>
