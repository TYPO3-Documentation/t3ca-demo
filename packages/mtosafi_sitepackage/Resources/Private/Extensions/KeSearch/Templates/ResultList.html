<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<f:comment>
    The result list plugin: without a search word the text of the search box plugin,
    otherwise the number of results and the results, or the message that there are none.
</f:comment>
<f:layout name="General" />

<f:section name="content">
    <f:if condition="{wordsTooShort}">
        <p class="alert"><f:translate key="search.results.tooShort" domain="mtosafi_sitepackage.frontend" arguments="{0: extConf.searchWordLength}" /></p>
    </f:if>
    <f:if condition="{isEmptySearch}">
        <f:then>
            <f:format.raw>{conf.textForResults}</f:format.raw>
        </f:then>
        <f:else if="{numberofresults} == 0">
            <p><f:translate key="search.results.none" domain="mtosafi_sitepackage.frontend" arguments="{0: searchword}" /></p>
        </f:else>
        <f:else>
            <f:render partial="ResultRows" arguments="{_all}" />
        </f:else>
    </f:if>
</f:section>
</html>
