<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<f:comment>
    Previous and next page of the news list. The design has no pagination; this
    uses its buttons.
</f:comment>
<f:if condition="{pagination.allPageNumbers -> f:count()} > 1">
    <nav class="section-header" aria-label="{f:translate(key: 'news.pagination', domain: 'mtosafi_sitepackage.frontend')}">
        <f:if condition="{pagination.previousPageNumber}">
            <a class="button" href="{f:uri.action(action: 'list', arguments: {currentPage: pagination.previousPageNumber}, addQueryString: 'untrusted')}"><f:translate key="news.pagination.previous" domain="mtosafi_sitepackage.frontend" /></a>
        </f:if>
        <span><f:translate key="news.pagination.status" domain="mtosafi_sitepackage.frontend" arguments="{0: paginator.currentPageNumber, 1: paginator.numberOfPages}" /></span>
        <f:if condition="{pagination.nextPageNumber}">
            <a class="button" href="{f:uri.action(action: 'list', arguments: {currentPage: pagination.nextPageNumber}, addQueryString: 'untrusted')}"><f:translate key="news.pagination.next" domain="mtosafi_sitepackage.frontend" /></a>
        </f:if>
    </nav>
</f:if>
</html>
