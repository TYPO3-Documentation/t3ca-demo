<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<f:comment>
    One link of a menu processor item. The current page gets aria-current="page".
    With markActive, a page above the current one gets aria-current="true".
</f:comment>
<f:if condition="{item.current}">
    <f:then><a href="{item.link}" aria-current="page">{item.title}</a></f:then>
    <f:else if="{markActive} && {item.active}"><a href="{item.link}" aria-current="true">{item.title}</a></f:else>
    <f:else><a href="{item.link}">{item.title}</a></f:else>
</f:if>
</html>
