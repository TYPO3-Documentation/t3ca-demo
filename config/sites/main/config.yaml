base: 'https://demo.ddev.site/'
dependencies:
  - mtosafi/sitepackage
errorHandling:
  -
    errorCode: 404
    errorHandler: Page
    errorContentSource: 't3://page?uid=33'
languages:
  -
    title: English
    enabled: true
    languageId: 0
    base: /
    locale: en_US.UTF-8
    navigationTitle: English
    flag: us
  -
    title: Kiswahili
    enabled: true
    languageId: 1
    base: /sw/
    locale: sw_KE.UTF-8
    navigationTitle: Kiswahili
    flag: ke
    fallbackType: fallback
    fallbacks: '0'
rootPageId: 1
routes: {  }
